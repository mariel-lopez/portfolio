  <script>
    (async function () {
      var ACCESS_KEY = 'etc_access_granted';
      var PASSWORD_HASH = '143705b2daf4782f008a1fc7aedddf3ee66e8b42d295cf07cdc015ab93b90be9';
      try {
        if (sessionStorage.getItem(ACCESS_KEY) === 'true') return;
      } catch (e) {}

      if (!window.crypto || !window.crypto.subtle || !window.TextEncoder) {
        window.alert('Unable to validate access.');
        var unsupportedWeb = window.location.protocol.indexOf('http') === 0;
        window.location.replace(unsupportedWeb ? '/' : 'index.html');
        return;
      }

      var input = window.prompt('Enter password to access this page:');
      if (input === null) {
        var cancelledWeb = window.location.protocol.indexOf('http') === 0;
        window.location.replace(cancelledWeb ? '/' : 'index.html');
        return;
      }

      var data = new TextEncoder().encode(input);
      var digest = await window.crypto.subtle.digest('SHA-256', data);
      var hash = Array.from(new Uint8Array(digest)).map(function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');

      if (hash === PASSWORD_HASH) {
        try { sessionStorage.setItem(ACCESS_KEY, 'true'); } catch (e) {}
        return;
      }

      window.alert('Incorrect password.');
      var isWeb = window.location.protocol.indexOf('http') === 0;
      window.location.replace(isWeb ? '/' : 'index.html');
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    :root {
      --mono-serif: "Apercu Pro", "Helvetica Neue", Helvetica, Geist, Arial, sans-serif;
      --etc-tab-active: #111111;
      --etc-tab-inactive: rgba(0, 0, 0, 0.22);
      --etc-photo-placeholder: #d4d4d4;
      --etc-light-bg: #f5f5f2;
      --etc-viewer-max: 500px;
    }

    body.etc-page {
      background: var(--page-bg);
      color: var(--body-color);
      min-height: 100vh;
      overflow-x: clip;
    }

    body.etc-tab-photography,
    body.etc-tab-random {
      background: var(--etc-light-bg);
      color: #111111;
    }

    .etc-main {
      position: relative;
      z-index: 1;
      flex: 1 0 auto;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding-bottom: var(--space-96);
      overflow-x: clip;
      text-align: left;
    }

    /* Two-column layout — left nav, right scrollable content (matches About rhythm) */
    .etc-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-32);
      align-items: start;
      width: 100%;
      min-width: 0;
    }

    .etc-sidebar {
      min-width: 0;
      padding-left: 0;
    }

    /* Tabs share the same left edge as the back-arrow cap (nav.css optical offset) */
    .etc-sidebar .etc-tabs {
      margin-left: 0;
    }

    .etc-content {
      min-width: 0;
      width: 100%;
    }

    .etc-tabs {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      flex-wrap: wrap;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      gap: clamp(16px, 4vw, 32px);
      margin: 0;
      padding: 0;
      border: 0;
      list-style: none;
    }

    .etc-tab {
      font-family: var(--mono-serif);
      font-size: clamp(1.25rem, 6.4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--etc-tab-active);
      opacity: 0.28;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-align: left;
      transition: opacity 0.2s ease;
      flex: 0 0 auto;
    }

    .etc-tab.is-active {
      opacity: 1;
    }

    @media (min-width: 861px) {
      .etc-layout {
        /* Fixed sidebar width — “photography” is widest; stops column jump on tab change */
        grid-template-columns: 12.25rem minmax(0, 1fr);
        column-gap: clamp(40px, 5vw, 72px);
        row-gap: 0;
      }

      .etc-sidebar {
        position: sticky;
        top: calc(var(--site-nav-height, 96px) + var(--space-16));
        align-self: start;
        z-index: 1;
        width: 12.25rem;
        max-width: 12.25rem;
        flex-shrink: 0;
      }

      .etc-tabs {
        display: grid;
        grid-template-columns: 1fr;
        align-items: start;
        justify-items: start;
        gap: var(--space-24);
        width: 100%;
      }

      .etc-tab {
        font-size: clamp(1.25rem, 2.1vw, 2.25rem);
        white-space: nowrap;
        width: 100%;
        min-height: 1em;
      }
    }

    @media (max-width: 860px) {
      .etc-tab {
        font-size: clamp(1.1875rem, 6.8vw, 1.875rem);
      }
    }

    @media (max-width: 400px) {
      .etc-tab {
        font-size: clamp(1.125rem, 7.2vw, 1.625rem);
      }
    }

    .etc-tab:focus-visible {
      outline: 2px solid var(--etc-tab-active);
      outline-offset: 4px;
    }

    .etc-panel {
      display: none !important;
      width: 100%;
      min-width: 0;
    }

    .etc-panel.is-active {
      display: block !important;
    }

    .etc-panel--random.is-active {
      display: flex !important;
      flex-direction: column;
      align-items: flex-start;
    }

    .etc-writing-title {
      font-size: clamp(1.35rem, 3.2vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--etc-tab-active);
      max-width: none;
      width: 100%;
    }

    .etc-writing-body {
      margin-top: var(--space-24);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--etc-tab-active);
      max-width: none;
      width: 100%;
    }

    .etc-random-intro {
      display: flex;
      flex-direction: column;
      gap: var(--space-16);
      width: 100%;
      max-width: none;
      margin: 0 0 clamp(28px, 4.5vw, 48px);
      padding-inline: 0;
      text-align: left;
      box-sizing: border-box;
    }

    .etc-random-intro p {
      margin: 0;
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      letter-spacing: var(--body-letter-spacing);
      color: rgba(0, 0, 0, 0.58);
    }

    /* Album mosaic — compact, hand-placed grid */
    .etc-album-mosaic {
      display: grid;
      grid-template-columns: repeat(4, auto);
      justify-content: start;
      align-items: center;
      gap: clamp(18px, 2.8vw, 28px) clamp(14px, 2.2vw, 24px);
      width: 100%;
      max-width: 520px;
      margin: 0;
      padding: var(--space-8) 0 var(--space-16);
    }

    .etc-album-piece {
      margin: 0;
      justify-self: center;
      transform: rotate(var(--etc-rot, 0deg));
      transition:
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .etc-album-piece:nth-child(1) { --etc-rot: -2.4deg; margin-top: 6px; }
    .etc-album-piece:nth-child(2) { --etc-rot: 1.8deg; margin-top: 14px; }
    .etc-album-piece:nth-child(3) { --etc-rot: -1.2deg; }
    .etc-album-piece:nth-child(4) { --etc-rot: 2.2deg; margin-top: -4px; }
    .etc-album-piece:nth-child(5) { --etc-rot: -1.6deg; margin-top: 8px; }
    .etc-album-piece:nth-child(6) { --etc-rot: 1.4deg; margin-top: -6px; }
    .etc-album-piece:nth-child(7) { --etc-rot: 2deg; margin-top: 4px; }
    .etc-album-piece:nth-child(8) { --etc-rot: -2.1deg; margin-top: 10px; }

    .etc-album-piece:hover,
    .etc-album-piece:focus-within {
      transform: rotate(0deg) translateY(-3px);
      z-index: 1;
    }

    .etc-album-art {
      display: block;
      width: var(--etc-album-w, 112px);
      aspect-ratio: var(--etc-album-ar, 1 / 1);
      border-radius: 14px;
      border: 1px solid rgba(0, 0, 0, 0.07);
      background: linear-gradient(145deg, #f0ebe3 0%, #d8d0c4 100%);
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.045),
        0 12px 28px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      transition: box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .etc-album-piece:hover .etc-album-art,
    .etc-album-piece:focus-within .etc-album-art {
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.07),
        0 18px 40px rgba(0, 0, 0, 0.065);
    }

    .etc-album-piece[data-shape="portrait"] {
      --etc-album-w: 96px;
      --etc-album-ar: 2 / 3;
    }

    .etc-album-piece[data-shape="square"] {
      --etc-album-w: 108px;
      --etc-album-ar: 1 / 1;
    }

    .etc-album-piece:nth-child(3n+2) .etc-album-art {
      background: linear-gradient(145deg, #e8e4f0 0%, #c8c0d8 100%);
    }

    .etc-album-piece:nth-child(3n) .etc-album-art {
      background: linear-gradient(145deg, #e3ece8 0%, #c5d4cc 100%);
    }

    @media (max-width: 520px) {
      .etc-album-mosaic {
        grid-template-columns: repeat(3, auto);
        max-width: 100%;
        gap: 16px 20px;
      }

      .etc-album-piece[data-shape="square"] {
        --etc-album-w: 96px;
      }

      .etc-album-piece[data-shape="portrait"] {
        --etc-album-w: 84px;
      }
    }

    @media (max-width: 360px) {
      .etc-album-mosaic {
        grid-template-columns: repeat(2, auto);
      }

      .etc-album-piece[data-shape="square"] {
        --etc-album-w: 88px;
      }

      .etc-album-piece[data-shape="portrait"] {
        --etc-album-w: 76px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .etc-album-piece,
      .etc-album-art {
        transition-duration: 0.05s;
      }

      .etc-album-piece:hover,
      .etc-album-piece:focus-within {
        transform: rotate(var(--etc-rot, 0deg));
      }
    }

    /* Photography — featured frame (max 500×500) + full-width filmstrip (no edge clip) */
    .etc-viewer {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin-inline: 0;
      outline: none;
    }

    .etc-viewer-stage-wrap,
    .etc-viewer-meta,
    .etc-viewer-hint {
      width: min(100%, var(--etc-viewer-max));
      max-width: var(--etc-viewer-max);
      margin-inline: 0;
    }

    .etc-viewer:focus-visible {
      outline: 2px solid var(--etc-tab-active);
      outline-offset: 6px;
      border-radius: 8px;
    }

    .etc-viewer-stage-wrap {
      position: relative;
      width: min(100%, var(--etc-viewer-max));
      max-width: var(--etc-viewer-max);
      margin: 0 0 var(--space-32);
      padding: 0;
    }

    .etc-viewer-stack {
      position: absolute;
      inset: 8% 6% -4% 10%;
      border-radius: 22px;
      background: var(--etc-photo-placeholder);
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.08);
      transform: rotate(-2.5deg);
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
    }

    .etc-viewer-stage {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--etc-viewer-max);
      max-height: var(--etc-viewer-max);
      margin: 0;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.07);
      background: var(--etc-photo-placeholder);
      box-shadow:
        0 6px 22px rgba(0, 0, 0, 0.055),
        0 18px 44px rgba(0, 0, 0, 0.07);
      transform: rotate(1.25deg);
      aspect-ratio: 4 / 3;
    }

    .etc-viewer-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transition: opacity 0.35s ease;
    }

    .etc-viewer-image.is-fading {
      opacity: 0;
    }

    .etc-viewer-meta {
      text-align: left;
      max-width: min(28ch, var(--etc-viewer-max));
      margin-bottom: var(--space-32);
      padding: 0;
      box-sizing: border-box;
    }

    .etc-viewer-title {
      font-size: clamp(1.15rem, 2.6vw, 1.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--etc-tab-active);
    }

    .etc-viewer-caption {
      margin-top: 6px;
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      font-style: italic;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: rgba(0, 0, 0, 0.52);
    }

    .etc-viewer-filmstrip {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: var(--space-16);
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin-inline: 0;
      padding: var(--space-8) 0 var(--space-16);
      overflow: visible;
    }

    .etc-thumb {
      flex: 0 0 auto;
      width: clamp(52px, 12vw, 72px);
      padding: 0;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 14px;
      overflow: hidden;
      background: var(--etc-photo-placeholder);
      cursor: pointer;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .etc-thumb img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: center center;
    }

    .etc-thumb:hover {
      border-color: rgba(0, 0, 0, 0.22);
    }

    .etc-thumb.is-active {
      border-color: var(--etc-tab-active);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .etc-thumb:focus-visible {
      outline: 2px solid var(--etc-tab-active);
      outline-offset: 3px;
    }

    .etc-viewer-hint {
      display: block;
      margin-top: var(--space-16);
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
      color: rgba(0, 0, 0, 0.38);
      text-align: left;
    }

    html.dark-theme {
      --etc-tab-active: #f5f5f2;
      --etc-tab-inactive: rgba(245, 245, 242, 0.28);
    }

    html.dark-theme body.etc-tab-photography,
    html.dark-theme body.etc-tab-random {
      background: var(--etc-light-bg);
      color: #111111;
    }

    html.dark-theme body.etc-tab-photography .etc-tab.is-active,
    html.dark-theme body.etc-tab-random .etc-tab.is-active {
      color: #111111;
    }

    html.dark-theme body.etc-tab-photography .etc-tab,
    html.dark-theme body.etc-tab-random .etc-tab {
      color: #111111;
    }

    html.dark-theme body.etc-tab-photography .etc-tab:not(.is-active),
    html.dark-theme body.etc-tab-random .etc-tab:not(.is-active) {
      opacity: 0.28;
    }

    html.dark-theme body.etc-tab-photography .etc-tab.is-active,
    html.dark-theme body.etc-tab-random .etc-tab.is-active {
      opacity: 1;
    }

    html.dark-theme body.etc-tab-random .etc-random-intro p {
      color: rgba(0, 0, 0, 0.52);
    }

    html.dark-theme body.etc-tab-photography .etc-viewer-caption {
      color: rgba(0, 0, 0, 0.48);
    }

    html.dark-theme body.etc-tab-photography .etc-viewer-hint {
      color: rgba(0, 0, 0, 0.42);
    }

    @media (max-width: 900px) {
      .etc-main {
        padding-bottom: var(--space-64);
      }

      .etc-album-mosaic {
        padding-inline: var(--space-8);
      }
    }

    @media (max-width: 640px) {
      .etc-layout {
        gap: var(--space-24);
      }

      .etc-tabs {
        gap: var(--space-16) var(--space-24);
      }

      .etc-viewer-stage-wrap {
        margin-bottom: var(--space-24);
        width: 100%;
        max-width: min(var(--etc-viewer-max), 100%);
      }

      .etc-viewer-stage {
        border-radius: 22px;
        transform: none;
        max-height: min(var(--etc-viewer-max), calc(100vw - 2 * var(--content-pad)));
      }

      .etc-viewer-stack {
        display: none;
      }

      .etc-viewer-meta {
        margin-bottom: var(--space-24);
      }

      .etc-viewer-filmstrip {
        justify-content: flex-start;
        padding-inline: 0;
      }

      .etc-viewer-hint {
        font-size: 0.75rem;
      }

      .etc-random-intro {
        padding-inline: 0;
      }
    }

    @media (max-width: 400px) {
      .etc-tabs {
        gap: var(--space-16);
      }

      .etc-thumb {
        width: 48px;
        border-radius: 12px;
      }

      .etc-viewer-stage {
        border-radius: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .etc-viewer-image,
      .etc-thumb {
        transition-duration: 0.05s;
      }

      .etc-viewer-stage,
      .etc-viewer-stack {
        transform: none;
      }
    }
  </style>
</head>
